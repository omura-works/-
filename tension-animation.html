<title>糸の張力アニメ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: 16:9 の「黒板スクリーン」を中央に置き、その下に再生コントロールとシーン一覧 */
:root{
  --page:#eef1f7; --panel:#ffffff; --ink:#18213a; --muted:#5b6785; --line:#d5dbea;
  --accent:#2f6fde; --chip:#e6ebf6;
  --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#0a0f1c; --panel:#121a2e; --ink:#e8eefc; --muted:#94a2c4; --line:#26314d;
  --accent:#6aa8ff; --chip:#1b2540; color-scheme:dark;}}
:root[data-theme="dark"]{
  --page:#0a0f1c; --panel:#121a2e; --ink:#e8eefc; --muted:#94a2c4; --line:#26314d;
  --accent:#6aa8ff; --chip:#1b2540; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header h1{font-size:clamp(1.15rem,2.6vw,1.6rem);margin:0;font-weight:900;text-wrap:balance}
header p{margin:.25rem 0 0;color:var(--muted);font-size:.92rem}
.stage{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#0d1424;box-shadow:0 10px 30px rgba(10,20,50,.25)}
canvas{width:100%;height:100%;display:block}
.bigplay{position:absolute;inset:0;margin:auto;width:96px;height:96px;border-radius:50%;border:0;background:rgba(255,224,102,.95);color:#1a1a1a;font-size:40px;cursor:pointer;box-shadow:0 0 0 12px rgba(255,224,102,.18)}
.ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ctrl button,.ctrl select{font-family:var(--font);font-weight:700;font-size:.95rem;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
.ctrl button:focus-visible,.ctrl select:focus-visible,.scenes button:focus-visible,#seek:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#seek{flex:1 1 220px;min-width:0;accent-color:var(--accent)}
.time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;min-width:7.5em;text-align:right}
.scenes{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.scenes button{font-family:var(--font);text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 10px;cursor:pointer;font-size:.85rem;line-height:1.35}
.scenes button b{display:block;font-size:.72rem;color:var(--muted);letter-spacing:.06em}
.scenes button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.note{color:var(--muted);font-size:.82rem;margin:0}
</style>

<div class="wrap">
  <header>
    <h1>糸が物体を引く力（張力）T₁・T₂ を求めよう</h1>
    <p>第11回プリント［1］〜［5］の解き方アニメーション（約90秒）。スペースキーで再生／一時停止、←→で前後のシーンへ。</p>
  </header>
  <div class="stage" id="stage">
    <canvas id="cv" width="1920" height="1080" aria-label="張力の解説アニメーション"></canvas>
    <button class="bigplay" id="bigplay" aria-label="再生">▶</button>
  </div>
  <div class="ctrl">
    <button id="play" aria-label="再生・一時停止">▶ 再生</button>
    <button id="prev" aria-label="前のシーン">⏮</button>
    <button id="next" aria-label="次のシーン">⏭</button>
    <input id="seek" type="range" min="0" max="1000" value="0" aria-label="再生位置">
    <span class="time" id="time">0:00 / 1:30</span>
    <select id="speed" aria-label="再生速度">
      <option value="0.75">0.75倍</option><option value="1" selected>1倍</option><option value="1.25">1.25倍</option><option value="1.5">1.5倍</option>
    </select>
  </div>
  <div class="scenes" id="scenes"></div>
  <p class="note">重力は「質量 × 9.8」（g = 9.8 m/s²）で計算しています。色のルール：<b style="color:#2f86f0">青＝T₁</b>・<b style="color:#e09a1c">橙＝T₂</b>・<b style="color:#e8445f">赤＝重力</b>・<b style="color:#9a72f0">紫＝角度</b>。</p>
</div>

<script>
(()=>{
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=1920,H=1080;
const C={bg:'#0d1424',T1:'#4FA3FF',T2:'#FFB547',mg:'#FF5C7A',ang:'#B48CFF',hi:'#FFE066',ink:'#EAF0FF',mute:'#8A9BBE',line:'#C9D4EA',ok:'#5BE3A8'};
const COL={b:C.T1,o:C.T2,r:C.mg,p:C.ang,y:C.hi,m:C.mute,w:C.ink,g:C.ok};
const FONT='"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif';
const font=(s,w=700)=>`${w} ${s}px ${FONT}`;
const clamp=x=>x<0?0:x>1?1:x;
const ease=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const pr=(t,s,d=.6)=>ease((t-s)/d);
const D=Math.PI/180;

/* ---------- 背景（方眼の黒板） ---------- */
const bgc=document.createElement('canvas');bgc.width=W;bgc.height=H;
{const b=bgc.getContext('2d');
 const g=b.createRadialGradient(W*.42,H*.35,100,W*.5,H*.5,1200);g.addColorStop(0,'#16223b');g.addColorStop(1,'#0a101e');
 b.fillStyle=g;b.fillRect(0,0,W,H);
 b.strokeStyle='rgba(140,170,230,.06)';b.lineWidth=1;
 for(let x=0;x<W;x+=48){b.beginPath();b.moveTo(x+.5,0);b.lineTo(x+.5,H);b.stroke();}
 for(let y=0;y<H;y+=48){b.beginPath();b.moveTo(0,y+.5);b.lineTo(W,y+.5);b.stroke();}
 for(let i=0;i<1400;i++){b.fillStyle=`rgba(255,255,255,${Math.random()*.035})`;b.fillRect(Math.random()*W,Math.random()*H,2,2);}
}

/* ---------- 描画ヘルパー ---------- */
function arrow(x1,y1,x2,y2,col,o={}){
  const {w=10,p=1,dash=null,alpha=1,glow=true,head=30}=o; if(p<=0||alpha<=0)return;
  const ex=x1+(x2-x1)*p,ey=y1+(y2-y1)*p,a=Math.atan2(ey-y1,ex-x1),len=Math.hypot(ex-x1,ey-y1);
  const h=Math.min(head,len*.55);
  ctx.save();ctx.globalAlpha*=alpha;ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=w;ctx.lineCap='round';
  if(glow){ctx.shadowColor=col;ctx.shadowBlur=22;}
  if(dash)ctx.setLineDash(dash);
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(ex-Math.cos(a)*h*.7,ey-Math.sin(a)*h*.7);ctx.stroke();ctx.setLineDash([]);
  ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(ex-Math.cos(a-.45)*h,ey-Math.sin(a-.45)*h);ctx.lineTo(ex-Math.cos(a+.45)*h,ey-Math.sin(a+.45)*h);ctx.closePath();ctx.fill();
  ctx.restore();
}
function seg(x1,y1,x2,y2,col,o={}){
  const {w=4,p=1,dash=null,alpha=1}=o;if(p<=0||alpha<=0)return;
  ctx.save();ctx.globalAlpha*=alpha;ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';if(dash)ctx.setLineDash(dash);
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x1+(x2-x1)*p,y1+(y2-y1)*p);ctx.stroke();ctx.restore();
}
function text(s,x,y,o={}){
  const {size=40,col=C.ink,align='left',alpha=1,wt=700,glow=0}=o;if(alpha<=0)return;
  ctx.save();ctx.globalAlpha*=alpha;ctx.font=font(size,wt);ctx.fillStyle=col;ctx.textAlign=align;ctx.textBaseline='middle';
  if(glow){ctx.shadowColor=col;ctx.shadowBlur=glow;}ctx.fillText(s,x,y);ctx.restore();
}
function parse(m){const out=[],re=/\{(\w):([^}]*)\}/g;let last=0,r;
  while((r=re.exec(m))){if(r.index>last)out.push([m.slice(last,r.index),C.ink]);out.push([r[2],COL[r[1]]]);last=re.lastIndex;}
  if(last<m.length)out.push([m.slice(last),C.ink]);return out;}
function measure(m,size,wt=700){ctx.save();ctx.font=font(size,wt);const w=parse(m).reduce((a,s)=>a+ctx.measureText(s[0]).width,0);ctx.restore();return w;}
function rich(m,x,y,o={}){
  const {size=46,align='left',alpha=1,wt=700}=o;if(alpha<=0)return 0;
  ctx.save();ctx.globalAlpha*=alpha;ctx.font=font(size,wt);ctx.textBaseline='middle';
  const segs=parse(m),w=segs.reduce((a,s)=>a+ctx.measureText(s[0]).width,0);
  let cx=align==='center'?x-w/2:align==='right'?x-w:x;
  for(const [s,c] of segs){ctx.fillStyle=c;ctx.fillText(s,cx,y);cx+=ctx.measureText(s).width;}
  ctx.restore();return w;
}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
/* 計算は1行ずつ: lines=[{m,at,box,size}] */
function eqs(lines,x,y,t,gap=84){
  lines.forEach((ln,i)=>{
    const a=pr(t,ln.at,.55);if(a<=0)return;const size=ln.size||46,yy=y+i*gap;
    const w=rich(ln.m,x+(1-a)*36,yy,{size,alpha:a});
    if(ln.box){ctx.save();ctx.globalAlpha=a;ctx.strokeStyle=C.hi;ctx.lineWidth=4;ctx.shadowColor=C.hi;ctx.shadowBlur=16;rrect(x-18,yy-size*.85,w+36,size*1.7,14);ctx.stroke();ctx.restore();}
  });
}
function ceiling(x1,x2,y,alpha=1){
  ctx.save();ctx.globalAlpha*=alpha;ctx.strokeStyle=C.line;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(x2,y);ctx.stroke();
  ctx.lineWidth=2.5;ctx.globalAlpha*=.6;for(let x=x1+6;x<x2;x+=26){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+18,y-22);ctx.stroke();}ctx.restore();
}
function wall(x,y1,y2,alpha=1){
  ctx.save();ctx.globalAlpha*=alpha;ctx.strokeStyle=C.line;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x,y1);ctx.lineTo(x,y2);ctx.stroke();
  ctx.lineWidth=2.5;ctx.globalAlpha*=.6;for(let y=y1+6;y<y2;y+=26){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+22,y-18);ctx.stroke();}ctx.restore();
}
function ball(x,y,r,label,alpha=1){
  ctx.save();ctx.globalAlpha*=alpha;const g=ctx.createRadialGradient(x-r*.35,y-r*.4,r*.1,x,y,r);
  g.addColorStop(0,'#f4f7ff');g.addColorStop(1,'#7f8db0');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.restore();
  if(label)text(label,x+r+14,y+r+6,{size:38,col:C.ink,alpha});
}
function angArc(cx,cy,r,a0,a1,label,p=1,o={}){
  if(p<=0)return;const {col=C.ang,lr=r+42,size=36}=o;
  ctx.save();ctx.strokeStyle=col;ctx.lineWidth=4;ctx.globalAlpha*=p;ctx.beginPath();ctx.arc(cx,cy,r,a0,a0+(a1-a0)*p,a1<a0);ctx.stroke();ctx.restore();
  const m=(a0+a1)/2;text(label,cx+Math.cos(m)*lr,cy+Math.sin(m)*lr,{size,col,align:'center',alpha:p});
}
function rightMark(x,y,dx,dy,alpha=1){ctx.save();ctx.globalAlpha*=alpha;ctx.strokeStyle=C.mute;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x+dx,y);ctx.lineTo(x+dx,y+dy);ctx.lineTo(x,y+dy);ctx.stroke();ctx.restore();}
function pulse(x,y,r,t,col=C.hi){const k=(t*1.4)%1;ctx.save();ctx.strokeStyle=col;ctx.lineWidth=4;ctx.globalAlpha=(1-k)*.9;ctx.beginPath();ctx.arc(x,y,r+k*40,0,7);ctx.stroke();ctx.restore();}
function card(x,y,w,h,alpha=1,col='rgba(255,255,255,.05)'){ctx.save();ctx.globalAlpha*=alpha;ctx.fillStyle=col;ctx.strokeStyle='rgba(200,215,255,.16)';ctx.lineWidth=2;rrect(x,y,w,h,22);ctx.fill();ctx.stroke();ctx.restore();}

/* ---------- 画面の共通パーツ ---------- */
const STAGES=['問題','図にする','カギ','手順','まとめ'];
function chrome(sc,t){
  const cw=170,gap=14,tot=STAGES.length*cw+(STAGES.length-1)*gap;let x=(W-tot)/2;
  STAGES.forEach((s,i)=>{const on=i+1===sc.stage,done=i+1<sc.stage;
    ctx.save();ctx.fillStyle=on?'rgba(255,224,102,.95)':done?'rgba(255,255,255,.14)':'rgba(255,255,255,.05)';rrect(x,22,cw,44,22);ctx.fill();ctx.restore();
    text(`${i+1} ${s}`,x+cw/2,45,{size:24,col:on?'#1a1a1a':done?C.ink:C.mute,align:'center'});x+=cw+gap;});
  const a=pr(t,.1,.6);rich(sc.title,W/2,128+(1-a)*-14,{size:54,align:'center',alpha:a,wt:900});
  if(sc.telop){const b=pr(t,.9,.6);if(b>0){
    ctx.save();ctx.font=font(36,700);const tw=measure(sc.telop,36)+150,x0=(W-tw)/2,y0=968+(1-b)*20;
    ctx.globalAlpha=b;ctx.fillStyle='rgba(5,9,20,.78)';rrect(x0,y0,tw,76,38);ctx.fill();
    ctx.fillStyle=C.hi;rrect(x0+12,y0+14,96,48,24);ctx.fill();ctx.restore();
    text('なぜ？',x0+60,y0+39,{size:26,col:'#1a1a1a',align:'center',alpha:b,wt:900});
    rich(sc.telop,x0+126,y0+39,{size:36,alpha:b});}}
}

/* ---------- 問題[1]の図 ---------- */
const P1={B:[700,490],A:[215,210],Wx:1080,k:200/19.6};
P1.T1=[P1.B[0]-39.2*P1.k*Math.cos(30*D),P1.B[1]-39.2*P1.k*Math.sin(30*D)];
P1.T2=[P1.B[0]+19.6*Math.sqrt(3)*P1.k,P1.B[1]];
P1.G=[P1.B[0],P1.B[1]+19.6*P1.k];
function p1Scene(o){
  const {strings=1,arrows=[0,0,0],fade=[1,1,1],comp=0,compAlpha=1,labels=1,angle=1}=o;const [bx,by]=P1.B;
  ceiling(120,P1.Wx,210);wall(P1.Wx,210,680);
  angArc(P1.A[0],P1.A[1],80,0,30*D,'30°',angle);
  seg(P1.A[0],P1.A[1],bx,by,C.line,{w:3,alpha:strings});seg(bx,by,P1.Wx,by,C.line,{w:3,alpha:strings});
  if(comp>0){
    const [tx,ty]=P1.T1;
    seg(tx,ty,bx,ty,C.T1,{w:3,dash:[8,10],alpha:.6*compAlpha,p:comp});
    seg(tx,ty,tx,by,C.T1,{w:3,dash:[8,10],alpha:.6*compAlpha,p:comp});
    ctx.save();ctx.globalAlpha=.10*comp*compAlpha;ctx.fillStyle=C.T1;ctx.fillRect(tx,ty,bx-tx,by-ty);ctx.restore();
    arrow(bx,by,bx,ty,C.T1,{w:8,p:pr(comp,.3,.7),dash:[16,10],alpha:compAlpha,glow:false});
    arrow(bx,by,tx,by,C.T1,{w:8,p:pr(comp,.3,.7),dash:[16,10],alpha:compAlpha,glow:false});
    text('たて',bx+22,(by+ty)/2,{size:34,col:C.T1,alpha:clamp(comp*2-1)*compAlpha});
    text('よこ',(bx+tx)/2,by+42,{size:34,col:C.T1,align:'center',alpha:clamp(comp*2-1)*compAlpha});
  }
  arrow(bx,by,P1.T1[0],P1.T1[1],C.T1,{p:arrows[0],alpha:fade[0]});
  arrow(bx,by,P1.T2[0],P1.T2[1],C.T2,{p:arrows[1],alpha:fade[1]});
  arrow(bx,by,P1.G[0],P1.G[1],C.mg,{p:arrows[2],alpha:fade[2]});
  ball(bx,by,34,'2kg');
  text('T₁',430,282,{size:48,col:C.T1,alpha:labels*Math.max(fade[0],arrows[0]>0?1:strings)});
  text('T₂',900,446,{size:48,col:C.T2,alpha:labels*Math.max(fade[1],arrows[1]>0?1:strings)});
  if(arrows[2]>0)text('重力 19.6N',725,650,{size:34,col:C.mg,alpha:fade[2]*arrows[2]});
}

/* ---------- 綱引きゲージ（つり合いを図で見せる） ---------- */
function tug(cx,y,L,R,lc,rc,llab,rlab,p,t,settle){
  const wob=Math.sin(t*9)*26*(1-settle);const k=cx+wob;
  seg(cx-360,y,cx+360,y,'rgba(255,255,255,.12)',{w:2});
  ctx.save();ctx.globalAlpha=p;ctx.fillStyle=lc;ctx.shadowColor=lc;ctx.shadowBlur=14;rrect(k-L*p,y-20,L*p,40,10);ctx.fill();
  ctx.fillStyle=rc;ctx.shadowColor=rc;rrect(k,y-20,R*p,40,10);ctx.fill();ctx.restore();
  ctx.save();ctx.fillStyle='#fff';ctx.globalAlpha=p;ctx.beginPath();ctx.arc(k,y,13,0,7);ctx.fill();ctx.restore();
  seg(cx,y-46,cx,y+46,C.hi,{w:3,dash:[6,6],alpha:p*.8});
  rich(llab,cx-20,y-52,{size:30,align:'right',alpha:p});rich(rlab,cx+20,y-52,{size:30,alpha:p});
}

/* ---------- 一般の2本糸の図 ---------- */
function twoString(g,o){
  const {aL,aR,B,ceilY,cx1,cx2,TL,TR,G,mass,labL='30°',labR='30°',arr=1,comp=0,angle=1}=g;
  const [bx,by]=B;const h=by-ceilY;
  const A1=[bx-h/Math.tan(aL),ceilY],A2=[bx+h/Math.tan(aR),ceilY];
  ceiling(cx1,cx2,ceilY);
  seg(A1[0],A1[1],bx,by,C.line,{w:3,alpha:.55});seg(A2[0],A2[1],bx,by,C.line,{w:3,alpha:.55});
  angArc(A1[0],A1[1],70,0,aL,labL,angle);angArc(A2[0],A2[1],70,Math.PI,Math.PI-aR,labR,angle);
  const t1=[bx-TL*Math.cos(aL),by-TL*Math.sin(aL)],t2=[bx+TR*Math.cos(aR),by-TR*Math.sin(aR)];
  if(comp>0){
    const a=clamp(comp);
    seg(t1[0],t1[1],t1[0],by,C.T1,{w:3,dash:[8,10],alpha:.6*a});seg(t1[0],t1[1],bx-10,t1[1],C.T1,{w:3,dash:[8,10],alpha:.6*a});
    seg(t2[0],t2[1],t2[0],by,C.T2,{w:3,dash:[8,10],alpha:.6*a});seg(t2[0],t2[1],bx+10,t2[1],C.T2,{w:3,dash:[8,10],alpha:.6*a});
    arrow(bx-10,by,bx-10,t1[1],C.T1,{w:7,dash:[14,9],p:a,glow:false,head:24});
    arrow(bx+10,by,bx+10,t2[1],C.T2,{w:7,dash:[14,9],p:a,glow:false,head:24});
    arrow(bx,by+4,t1[0],by+4,C.T1,{w:7,dash:[14,9],p:a,glow:false,head:24});
    arrow(bx,by+4,t2[0],by+4,C.T2,{w:7,dash:[14,9],p:a,glow:false,head:24});
  }
  arrow(bx,by,t1[0],t1[1],C.T1,{p:arr});arrow(bx,by,t2[0],t2[1],C.T2,{p:arr});arrow(bx,by,bx,by+G,C.mg,{p:arr});
  ball(bx,by,30,mass);
  text('T₁',t1[0]-34,t1[1]-30,{size:44,col:C.T1,align:'center',alpha:arr});
  text('T₂',t2[0]+34,t2[1]-30,{size:44,col:C.T2,align:'center',alpha:arr});
}

/* ---------- シーン定義 ---------- */
const S=[];
/* 1. 問題の提示 */
S.push({stage:1,dur:6,name:'問題：何を求める？',title:'ゴール：2本の糸が物体を引く力 {b:T₁} と {o:T₂} の大きさ',
 telop:'まず［1］で解き方の「型」をつかめば、残りも同じ型で解ける',
 draw(t){
  p1Scene({strings:1,arrows:[0,0,0],labels:pr(t,.6),angle:pr(t,.4)});
  if(t>1.2){pulse(430,282,36,t);pulse(900,446,36,t+.3);}
  const a=pr(t,1.8);card(1200,270,560,330,a);
  text('求めるもの',1480,330,{size:32,col:C.mute,align:'center',alpha:a});
  rich('{b:T₁} = {y:？} N',1480,420,{size:64,align:'center',alpha:pr(t,2.2)});
  rich('{o:T₂} = {y:？} N',1480,520,{size:64,align:'center',alpha:pr(t,2.6)});
 }});
/* 2. 図にする */

/* ---------- タイムライン ---------- */
let starts=[],TOTAL=0;S.forEach(s=>{starts.push(TOTAL);TOTAL+=s.dur;});
let T=0,playing=false,last=0,speed=1;
function sceneAt(tt){let i=S.length-1;for(let k=0;k<S.length;k++){if(tt<starts[k]+S[k].dur){i=k;break;}}return i;}
function render(tt){
  const i=sceneAt(tt),sc=S[i],t=tt-starts[i];
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.drawImage(bgc,0,0);
  ctx.save();ctx.globalAlpha=clamp(t/.35);sc.draw(t);chrome(sc,t);ctx.restore();
  return i;
}
const $=id=>document.getElementById(id);
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
const sc=$('scenes');
S.forEach((s,i)=>{const b=document.createElement('button');b.innerHTML=`<b>${String(i+1).padStart(2,'0')} · ${STAGES[s.stage-1]}</b>${s.name}`;b.onclick=()=>{T=starts[i];draw();};sc.appendChild(b);});
let curScene=-1;
function draw(){
  const i=render(T);$('seek').value=Math.round(T/TOTAL*1000);$('time').textContent=`${fmt(T)} / ${fmt(TOTAL)}`;
  if(i!==curScene){curScene=i;[...sc.children].forEach((b,k)=>b.classList.toggle('on',k===i));}
}
function loop(now){if(!playing)return;const dt=Math.min(.1,(now-last)/1000);last=now;T+=dt*speed;
  if(T>=TOTAL){T=TOTAL-0.001;setPlay(false);}draw();requestAnimationFrame(loop);}
function setPlay(p){playing=p;$('play').textContent=p?'❚❚ 一時停止':'▶ 再生';$('bigplay').hidden=p;
  if(p){if(T>=TOTAL-.01)T=0;last=performance.now();requestAnimationFrame(loop);}}
$('play').onclick=()=>setPlay(!playing);$('bigplay').onclick=()=>setPlay(true);
$('prev').onclick=()=>{const i=sceneAt(T);T=starts[Math.max(0,(T-starts[i]<1)?i-1:i)];draw();};
$('next').onclick=()=>{const i=sceneAt(T);T=starts[Math.min(S.length-1,i+1)];draw();};
$('seek').oninput=e=>{T=e.target.value/1000*TOTAL;if(T>=TOTAL)T=TOTAL-.001;draw();};
$('speed').onchange=e=>{speed=+e.target.value;};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  if(e.code==='Space'){e.preventDefault();setPlay(!playing);}else if(e.code==='ArrowRight')$('next').click();else if(e.code==='ArrowLeft')$('prev').click();});
window.__renderAt=tt=>{render(tt);};window.__TOTAL=TOTAL;
/* 静止状態でも内容が見えるよう、最初は問題提示シーンの完成形を表示 */
T=4.5;
(document.fonts&&document.fonts.load?Promise.all([document.fonts.load(font(40,700)),document.fonts.load(font(40,900))]).catch(()=>{}):Promise.resolve()).then(()=>{draw();});
draw();
})();
