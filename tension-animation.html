<style>

  --accent:#2f6fde; --chip:#e6ebf6;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#0a0f1c; --panel:#121a2e; --ink:#e8eefc; --muted:#94a2c4; --line:#26314d;
  --accent:#6aa8ff; --chip:#1b2540; color-scheme:dark;}}
:root[data-theme="dark"]{
  --page:#0a0f1c; --panel:#121a2e; --ink:#e8eefc; --muted:#94a2c4; --line:#26314d;

  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}

<div class="wrap">
  <header>
    <h1>糸が物体を引く力（張力）T₁・T₂ を求めよう</h1>
    <p>第11回プリント［1］〜［5］の解き方（ナレーション・BGM付き）。スペースキーで再生／一時停止、←→で前後のシーンへ。下のチャプターから見たい所へ飛べます。</p>
  </header>
  <div class="stage" id="stage">
    <audio id="au" src="tension-animation-audio.mp3" preload="auto"></audio>
    <canvas id="cv" width="1920" height="1080" aria-label="張力の解説アニメーション"></canvas>
    <button class="bigplay" id="bigplay" aria-label="再生">▶</button>
  </div>
  <div class="ctrl">
    <button id="play" aria-label="再生・一時停止">▶ 再生</button>
    <button id="prev" aria-label="前のシーン">⏮</button>
    <button id="next" aria-label="次のシーン">⏭</button>
    <button id="mute" aria-label="音声のオン・オフ">🔊 音あり</button>
    <input id="seek" type="range" min="0" max="1000" value="0" aria-label="再生位置">
    <span class="time" id="time">0:00</span>
    <select id="speed" aria-label="再生速度">
      <option value="0.75">0.75倍</option><option value="1" selected>1倍</option><option value="1.25">1.25倍</option><option value="1.5">1.5倍</option>
    </select>
  </div>
  <div class="scenes" id="scenes"></div>
  <p class="note">重力は「質量 × 9.8」（g = 9.8 m/s²）。答えは 4g のように g を使って書いてもOK。色のルール：<b style="color:#2f86f0">青＝T₁</b>・<b style="color:#e09a1c">橙＝T₂</b>・<b style="color:#e8445f">赤＝重力</b>・<b style="color:#9a72f0">紫＝角度</b>・<b style="color:#1fae74">緑＝sin（たて）</b>・<b style="color:#e0559f">桃＝cos（よこ）</b>。<br>ナレーション：VOICEVOX:四国めたん ／ BGM：ベートーヴェン「月光ソナタ」第1楽章の冒頭をもとに独自に合成した演奏。</p>
</div>

<script>
(()=>{
const TIMING=/*TIMING*/{"cues": [[0.4, 5.564], [0.4, 3.505, 5.81, 9.001], [0.4, 1.969, 5.49], [0.4, 6.097, 9.202, 13.577, 18.741], [0.4, 3.42, 7.389, 10.59], [0.4, 4.977, 9.32], [0.4, 1.991, 7.144], [0.4, 4.593, 9.8, 14.463], [0.4, 3.047, 5.79, 9.365, 10.828], [0.4, 2.343, 5.395, 7.967], [0.4, 4.977, 8.658, 13.267], [0.4, 4.348, 9.459, 13.78, 18.485], [0.4, 2.769, 6.898, 9.47, 15.829, 18.273], [0.4, 4.668, 7.112, 8.756], [0.4, 3.857, 6.098, 8.915], [0.4, 2.524, 8.221, 11.988], [0.4, 2.087, 8.403, 11.562], [0.4, 5.681, 11.24], [0.4, 5.521, 8.584, 13.012, 17.664], [0.4, 1.767], [0.4, 1.82, 6.728, 10.751]], "durs": [9.12, 15.37, 9.4, 24.7, 17.27, 16.81, 10.07, 17.81, 14.19, 13.17, 18.55, 22.09, 23.47, 12.43, 11.85, 18.88, 15.99, 16.66, 24.28, 7.92, 18.18]}/*END*/;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=1920,H=1080;
const C={T1:'#4FA3FF',T2:'#FFB547',mg:'#FF5C7A',ang:'#B48CFF',hi:'#FFE066',ink:'#EAF0FF',mute:'#8A9BBE',line:'#C9D4EA',sin:'#5BE3A8',cos:'#FF8FD0'};
const COL={b:C.T1,o:C.T2,r:C.mg,p:C.ang,y:C.hi,m:C.mute,w:C.ink,g:C.sin,k:C.cos};
const FONT='"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif';
const font=(s,w=700)=>`${w} ${s}px ${FONT}`;
const clamp=x=>x<0?0:x>1?1:x;
const ease=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const pr=(t,s,d=.6)=>ease((t-s)/d);
const D=Math.PI/180;

/* ---------- 背景（方眼の黒板） ---------- */
const bgc=document.createElement('canvas');bgc.width=W;bgc.height=H;
{const b=bgc.getContext('2d');
 const g=b.createRadialGradient(W*.42,H*.35,100,W*.5,H*.5,1200);g.addColorStop(0,'#16223b');g.addColorStop(1,'#0a101e');
 b.fillStyle=g;b.fillRect(0,0,W,H);
 b.strokeStyle='rgba(140,170,230,.06)';b.lineWidth=1;
 for(let x=0;x<W;x+=48){b.beginPath();b.moveTo(x+.5,0);b.lineTo(x+.5,H);b.stroke();}
 for(let y=0;y<H;y+=48){b.beginPath();b.moveTo(0,y+.5);b.lineTo(W,y+.5);b.stroke();}
 let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
 for(let i=0;i<1400;i++){b.fillStyle=`rgba(255,255,255,${rnd()*.035})`;b.fillRect(rnd()*W,rnd()*H,2,2);}
}

/* ---------- 描画ヘルパー ---------- */
function arrow(x1,y1,x2,y2,col,o={}){
  const {w=10,p=1,dash=null,alpha=1,glow=true,head=30}=o; if(p<=0||alpha<=0)return;
  const ex=x1+(x2-x1)*p,ey=y1+(y2-y1)*p,a=Math.atan2(ey-y1,ex-x1),len=Math.hypot(ex-x1,ey-y1);
  if(len<2)return;const h=Math.min(head,len*.55);
  ctx.save();ctx.globalAlpha*=alpha;ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=w;ctx.lineCap='round';
  if(glow){ctx.shadowColor=col;ctx.shadowBlur=22;}
  if(dash)ctx.setLineDash(dash);
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(ex-Math.cos(a)*h*.7,ey-Math.sin(a)*h*.7);ctx.stroke();ctx.setLineDash([]);
  ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(ex-Math.cos(a-.45)*h,ey-Math.sin(a-.45)*h);ctx.lineTo(ex-Math.cos(a+.45)*h,ey-Math.sin(a+.45)*h);ctx.closePath();ctx.fill();
  ctx.restore();
}
function seg(x1,y1,x2,y2,col,o={}){
  const {w=4,p=1,dash=null,alpha=1,glow=0}=o;if(p<=0||alpha<=0)return;
  ctx.save();ctx.globalAlpha*=alpha;ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';if(dash)ctx.setLineDash(dash);
  if(glow){ctx.shadowColor=col;ctx.shadowBlur=glow;}
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x1+(x2-x1)*p,y1+(y2-y1)*p);ctx.stroke();ctx.restore();
}
function text(s,x,y,o={}){
  const {size=40,col=C.ink,align='left',alpha=1,wt=700}=o;if(alpha<=0)return;
  ctx.save();ctx.globalAlpha*=alpha;ctx.font=font(size,wt);ctx.fillStyle=col;ctx.textAlign=align;ctx.textBaseline='middle';
  ctx.fillText(s,x,y);ctx.restore();
}
/* 色マークアップ {b:…} と 分数 [[分子|分母]] */
function parse(m){const out=[],re=/\{(\w):([^}]*)\}/g;let last=0,r;
  while((r=re.exec(m))){if(r.index>last)out.push([m.slice(last,r.index),C.ink]);out.push([r[2],COL[r[1]]]);last=re.lastIndex;}
  if(last<m.length)out.push([m.slice(last),C.ink]);return out;}
function tokens(m){const out=[],re=/\[\[(.*?)\|(.*?)\]\]/g;let last=0,r;
  while((r=re.exec(m))){if(r.index>last)out.push({m:m.slice(last,r.index)});out.push({n:r[1],d:r[2]});last=re.lastIndex;}
  if(last<m.length)out.push({m:m.slice(last)});return out;}
function segW(m,size,wt){ctx.font=font(size,wt);return parse(m).reduce((a,s)=>a+ctx.measureText(s[0]).width,0);}
function tokW(tk,size,wt){if(tk.m!==undefined)return segW(tk.m,size,wt);const fs=size*.8;return Math.max(segW(tk.n,fs,wt),segW(tk.d,fs,wt))+size*.36;}
function drawSegs(m,x,y,size,wt){ctx.font=font(size,wt);for(const [s,c] of parse(m)){ctx.fillStyle=c;ctx.fillText(s,x,y);x+=ctx.measureText(s).width;}}
function richW(m,size=46,wt=700){ctx.save();const w=tokens(m).reduce((a,t)=>a+tokW(t,size,wt),0);ctx.restore();return w;}
function rich(m,x,y,o={}){
  const {size=46,align='left',alpha=1,wt=700}=o;if(alpha<=0)return 0;
  ctx.save();ctx.globalAlpha*=alpha;ctx.textBaseline='middle';
  const tks=tokens(m),w=tks.reduce((a,t)=>a+tokW(t,size,wt),0);
  let cx=align==='center'?x-w/2:align==='right'?x-w:x;
  for(const tk of tks){const tw=tokW(tk,size,wt);
    if(tk.m!==undefined)drawSegs(tk.m,cx,y,size,wt);
    else{const fs=size*.8,nw=segW(tk.n,fs,wt),dw=segW(tk.d,fs,wt);
      drawSegs(tk.n,cx+(tw-nw)/2,y-size*.56,fs,wt);drawSegs(tk.d,cx+(tw-dw)/2,y+size*.6,fs,wt);
      ctx.fillStyle=C.ink;ctx.fillRect(cx+size*.1,y-1.5,tw-size*.2,3);}
    cx+=tw;}
  ctx.restore();return w;
}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function hiBox(x,y,w,h,a,col=C.hi){if(a<=0)return;ctx.save();ctx.globalAlpha*=a;ctx.strokeStyle=col;ctx.lineWidth=4;ctx.shadowColor=col;ctx.shadowBlur=16;rrect(x,y,w,h,14);ctx.stroke();ctx.restore();}
/* 計算は1行ずつ: lines=[{m,at,box,size}] 。分数を含む行は自動で行間を広げる */
function eqs(lines,x,y,t){
  let yy=y;
  lines.forEach((ln,i)=>{
    const size=ln.size||44,fr=ln.m.includes('[['),h=size*(fr?2.5:1.75);
    if(i>0)yy+=h/2;
    const a=pr(t,ln.at,.55);
    if(a>0){const w=rich(ln.m,x+(1-a)*36,yy,{size,alpha:a});
      if(ln.box)hiBox(x-18,yy-h/2+4,w+36,h-8,a);}
    yy+=h/2+(ln.gap||14);
  });
}
function ceiling(x1,x2,y,alpha=1){
  ctx.save();ctx.globalAlpha*=alpha;ctx.strokeStyle=C.line;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x1,y);ctx.lineTo(x2,y);ctx.stroke();
  ctx.lineWidth=2.5;ctx.globalAlpha*=.6;for(let x=x1+6;x<x2;x+=26){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+18,y-22);ctx.stroke();}ctx.restore();
}
function wall(x,y1,y2,alpha=1){
  ctx.save();ctx.globalAlpha*=alpha;ctx.strokeStyle=C.line;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x,y1);ctx.lineTo(x,y2);ctx.stroke();
  ctx.lineWidth=2.5;ctx.globalAlpha*=.6;for(let y=y1+6;y<y2;y+=26){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+22,y-18);ctx.stroke();}ctx.restore();
}
function ball(x,y,r,label,alpha=1){
  ctx.save();ctx.globalAlpha*=alpha;const g=ctx.createRadialGradient(x-r*.35,y-r*.4,r*.1,x,y,r);
  g.addColorStop(0,'#f4f7ff');g.addColorStop(1,'#7f8db0');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.restore();
  if(label)text(label,x+r+14,y+r+6,{size:38,col:C.ink,alpha});
}
function angArc(cx,cy,r,a0,a1,label,p=1,o={}){
  if(p<=0)return;const {col=C.ang,lr=r+42,size=36}=o;
  ctx.save();ctx.strokeStyle=col;ctx.lineWidth=4;ctx.globalAlpha*=p;ctx.beginPath();ctx.arc(cx,cy,r,a0,a0+(a1-a0)*p,a1<a0);ctx.stroke();ctx.restore();
  const m=(a0+a1)/2;rich(label,cx+Math.cos(m)*lr,cy+Math.sin(m)*lr,{size,align:'center',alpha:p});
}
function rightMark(x,y,dx,dy,alpha=1){ctx.save();ctx.globalAlpha*=alpha;ctx.strokeStyle=C.mute;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x+dx,y);ctx.lineTo(x+dx,y+dy);ctx.lineTo(x,y+dy);ctx.stroke();ctx.restore();}
function pulse(x,y,r,t,col=C.hi){const k=(t*1.4)%1;ctx.save();ctx.strokeStyle=col;ctx.lineWidth=4;ctx.globalAlpha=(1-k)*.9;ctx.beginPath();ctx.arc(x,y,r+k*40,0,7);ctx.stroke();ctx.restore();}
function card(x,y,w,h,alpha=1,col='rgba(255,255,255,.05)'){if(alpha<=0)return;ctx.save();ctx.globalAlpha*=alpha;ctx.fillStyle=col;ctx.strokeStyle='rgba(200,215,255,.16)';ctx.lineWidth=2;rrect(x,y,w,h,22);ctx.fill();ctx.stroke();ctx.restore();}
function thumb(fn,ox,oy,s){ctx.save();ctx.translate(ox,oy);ctx.scale(s,s);fn();ctx.restore();}
function tri(A,B,Cp,o={}){const {alpha=1,fill='rgba(180,140,255,.10)'}=o;if(alpha<=0)return;ctx.save();ctx.globalAlpha*=alpha;ctx.fillStyle=fill;ctx.beginPath();ctx.moveTo(...A);ctx.lineTo(...B);ctx.lineTo(...Cp);ctx.closePath();ctx.fill();ctx.restore();}
/* 折れ線をなぞる光（筆記体 s・c の書き順） */
function trace(pts,p,col){if(p<=0)return;let L=0;const segs=[];for(let i=1;i<pts.length;i++){const l=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);segs.push(l);L+=l;}
  let rem=L*clamp(p);ctx.save();ctx.strokeStyle=col;ctx.lineWidth=14;ctx.lineCap='round';ctx.lineJoin='round';ctx.globalAlpha*=.55;ctx.shadowColor=col;ctx.shadowBlur=20;ctx.beginPath();ctx.moveTo(...pts[0]);let last=pts[0];
  for(let i=1;i<pts.length&&rem>0;i++){const f=Math.min(1,rem/segs[i-1]);last=[pts[i-1][0]+(pts[i][0]-pts[i-1][0])*f,pts[i-1][1]+(pts[i][1]-pts[i-1][1])*f];ctx.lineTo(...last);rem-=segs[i-1];}
  ctx.stroke();ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(...last,9,0,7);ctx.fill();ctx.restore();}

/* ---------- 画面の共通パーツ ---------- */
const STAGES=['問題','図にする','カギ','手順','まとめ'];
function chrome(sc,t){
  const cw=170,gap=14,tot=STAGES.length*cw+(STAGES.length-1)*gap;let x=(W-tot)/2;
  STAGES.forEach((s,i)=>{const on=i+1===sc.stage,done=i+1<sc.stage;
    ctx.save();ctx.fillStyle=on?'rgba(255,224,102,.95)':done?'rgba(255,255,255,.14)':'rgba(255,255,255,.05)';rrect(x,22,cw,44,22);ctx.fill();ctx.restore();
    text(`${i+1} ${s}`,x+cw/2,45,{size:24,col:on?'#1a1a1a':done?C.ink:C.mute,align:'center'});x+=cw+gap;});
  const a=pr(t,.1,.6);rich(sc.title,W/2,128+(1-a)*-14,{size:52,align:'center',alpha:a,wt:900});
  if(sc.telop){const b=pr(t,.9,.6);if(b>0){
    const tw=richW(sc.telop,34)+150,x0=(W-tw)/2,y0=968+(1-b)*20;
    ctx.save();ctx.globalAlpha=b;ctx.fillStyle='rgba(5,9,20,.78)';rrect(x0,y0,tw,76,38);ctx.fill();
    ctx.fillStyle=C.hi;rrect(x0+12,y0+14,96,48,24);ctx.fill();ctx.restore();
    text('なぜ？',x0+60,y0+39,{size:26,col:'#1a1a1a',align:'center',alpha:b,wt:900});
    rich(sc.telop,x0+126,y0+39,{size:34,alpha:b});}}
}

/* ---------- 問題[1]の図 ---------- */
const P1={B:[700,490],A:[215,210],Wx:1080,k:200/19.6};
P1.T1=[P1.B[0]-39.2*P1.k*Math.cos(30*D),P1.B[1]-39.2*P1.k*Math.sin(30*D)];
P1.T2=[P1.B[0]+19.6*Math.sqrt(3)*P1.k,P1.B[1]];
P1.G=[P1.B[0],P1.B[1]+19.6*P1.k];
function p1Scene(o){
  const {strings=1,arrows=[0,0,0],fade=[1,1,1],comp=0,compAlpha=1,labels=1,angle=1,ang='30°',cl=['たて','よこ'],mass='2kg',gl='重力 19.6N'}=o;const [bx,by]=P1.B;
  ceiling(120,P1.Wx,210);wall(P1.Wx,210,680);
  angArc(P1.A[0],P1.A[1],80,0,30*D,'{p:'+ang+'}',angle);
  seg(P1.A[0],P1.A[1],bx,by,C.line,{w:3,alpha:strings});seg(bx,by,P1.Wx,by,C.line,{w:3,alpha:strings});
  if(comp>0){
    const [tx,ty]=P1.T1;
    seg(tx,ty,bx,ty,C.T1,{w:3,dash:[8,10],alpha:.6*compAlpha,p:comp});
    seg(tx,ty,tx,by,C.T1,{w:3,dash:[8,10],alpha:.6*compAlpha,p:comp});
    ctx.save();ctx.globalAlpha=.10*comp*compAlpha;ctx.fillStyle=C.T1;ctx.fillRect(tx,ty,bx-tx,by-ty);ctx.restore();
    arrow(bx,by,bx,ty,C.T1,{w:8,p:pr(comp,.3,.7),dash:[16,10],alpha:compAlpha,glow:false});
    arrow(bx,by,tx,by,C.T1,{w:8,p:pr(comp,.3,.7),dash:[16,10],alpha:compAlpha,glow:false});
    const la=clamp(comp*2-1)*compAlpha;
    rich(cl[0],bx+22,(by+ty)/2,{size:34,alpha:la});
    rich(cl[1],(bx+tx)/2,by+44,{size:34,align:'center',alpha:la});
  }

/* ---------- 綱引きゲージ（つり合いを図で見せる） ---------- */
function tug(cx,y,L,R,lc,rc,llab,rlab,p,t,settle){
  const wob=Math.sin(t*9)*26*(1-settle);const k=cx+wob;
  seg(cx-360,y,cx+360,y,'rgba(255,255,255,.12)',{w:2});
  ctx.save();ctx.globalAlpha=p;ctx.fillStyle=lc;ctx.shadowColor=lc;ctx.shadowBlur=14;rrect(k-L*p,y-20,L*p,40,10);ctx.fill();
  ctx.fillStyle=rc;ctx.shadowColor=rc;rrect(k,y-20,R*p,40,10);ctx.fill();ctx.restore();
  ctx.save();ctx.fillStyle='#fff';ctx.globalAlpha=p;ctx.beginPath();ctx.arc(k,y,13,0,7);ctx.fill();ctx.restore();
  seg(cx,y-46,cx,y+46,C.hi,{w:3,dash:[6,6],alpha:p*.8});
  rich(llab,cx-20,y-54,{size:30,align:'right',alpha:p});rich(rlab,cx+20,y-54,{size:30,alpha:p});
}

/* ---------- 2本ともななめの図 ---------- */
function twoString(g){
  const {aL,aR,B,ceilY,cx1,cx2,TL,TR,G,mass,labL='30°',labR='30°',arr=1,comp=0,angle=1}=g;
  const [bx,by]=B;const h=by-ceilY;
  const A1=[bx-h/Math.tan(aL),ceilY],A2=[bx+h/Math.tan(aR),ceilY];
  ceiling(cx1,cx2,ceilY);
  seg(A1[0],A1[1],bx,by,C.line,{w:3,alpha:.55});seg(A2[0],A2[1],bx,by,C.line,{w:3,alpha:.55});
  angArc(A1[0],A1[1],70,0,aL,'{p:'+labL+'}',angle);angArc(A2[0],A2[1],70,Math.PI,Math.PI-aR,'{p:'+labR+'}',angle);
  const t1=[bx-TL*Math.cos(aL),by-TL*Math.sin(aL)],t2=[bx+TR*Math.cos(aR),by-TR*Math.sin(aR)];
  if(comp>0){
    const a=clamp(comp);
    seg(t1[0],t1[1],t1[0],by,C.T1,{w:3,dash:[8,10],alpha:.6*a});seg(t1[0],t1[1],bx-10,t1[1],C.T1,{w:3,dash:[8,10],alpha:.6*a});
    seg(t2[0],t2[1],t2[0],by,C.T2,{w:3,dash:[8,10],alpha:.6*a});seg(t2[0],t2[1],bx+10,t2[1],C.T2,{w:3,dash:[8,10],alpha:.6*a});
    arrow(bx-10,by,bx-10,t1[1],C.T1,{w:7,dash:[14,9],p:a,glow:false,head:24});
    arrow(bx+10,by,bx+10,t2[1],C.T2,{w:7,dash:[14,9],p:a,glow:false,head:24});
    arrow(bx,by+4,t1[0],by+4,C.T1,{w:7,dash:[14,9],p:a,glow:false,head:24});
    arrow(bx,by+4,t2[0],by+4,C.T2,{w:7,dash:[14,9],p:a,glow:false,head:24});
  }
  arrow(bx,by,t1[0],t1[1],C.T1,{p:arr});arrow(bx,by,t2[0],t2[1],C.T2,{p:arr});arrow(bx,by,bx,by+G,C.mg,{p:arr});
  ball(bx,by,30,mass);
  text('T₁',t1[0]-34,t1[1]-30,{size:44,col:C.T1,align:'center',alpha:arr});
  text('T₂',t2[0]+34,t2[1]-30,{size:44,col:C.T2,align:'center',alpha:arr});
}

add({stage:4,name:'［5］代入する',title:'［5］ 水平の式で {b:T₁} を消す（代入）',

/* 16 加法定理 */
add({stage:4,name:'［5］加法定理',title:'かっこの中は {p:加法定理} で1つにまとまる',

  const idx=[1,2,4,5],words=['咲いた','コスモス','コスモス','咲いた'],cols=[C.sin,C.cos,C.cos,C.sin];
  words.forEach((wd,i)=>{const a=pr(t,q[2]+.5+i*.55,.4);if(a<=0)return;const j=idx[i],cx=x0+pos[j]+richW(parts[j],64)/2;
    ctx.save();ctx.globalAlpha=a;ctx.fillStyle=cols[i];rrect(cx-70,y0+60+(1-a)*20,140,54,27);ctx.fill();ctx.restore();
    text(wd,cx,y0+87+(1-a)*20,{size:28,col:'#14182a',align:'center',alpha:a,wt:900});});
  card(300,560,1320,300,pr(t,q[3]));
  rich('確かめ：θ₁ = θ₂ = {p:30°} のとき',350,620,{size:38,alpha:pr(t,q[3])});
  rich('左辺 sin{p:60°} = [[√3|2]]　　右辺 [[{g:1}|2]]·[[{k:√3}|2]] + [[{k:√3}|2]]·[[{g:1}|2]] = [[√3|2]]　{y:✓}',350,750,{size:42,alpha:pr(t,q[3]+1.5)});
 }});
/* 17 [5] 結果 */
add({stage:4,name:'［5］公式の完成',title:'［5］ 答えの公式（{y:暗記}しておくと強い）',
 telop:'分子は「反対側の糸の角度」の cos',
 draw(t,q){
  thumb(()=>{G5.arr=1;G5.comp=0;G5.angle=1;twoString(G5);},10,110,.7);
  card(760,230,1100,640,pr(t,q[0]));
  eqs([{m:'{o:T₂} × [[sin(θ₁+θ₂)|{k:cosθ₁}]] = {r:mg}',at:q[0],size:46},{m:'{o:T₂} = [[{k:cosθ₁}|sin(θ₁+θ₂)]] × {r:mg}',at:q[1],box:true,size:52},{m:'{b:T₁} = [[{k:cosθ₂}|sin(θ₁+θ₂)]] × {r:mg}',at:q[2],box:true,size:52}],820,330,t);
  const h=pr(t,q[3]);
  if(h>0){const s=.7,ox=10,oy=110,A2x=(G5.B[0]+(G5.B[1]-G5.ceilY)/Math.tan(G5.aR))*s+ox,A2y=G5.ceilY*s+oy;
    pulse(A2x-50,A2y+30,30,t,C.ang);
    rich('{b:T₁} の分子 ＝ 反対側 {p:θ₂} の {k:cos}',380,780,{size:34,align:'center',alpha:h});
    rich('{o:T₂} の分子 ＝ 反対側 {p:θ₁} の {k:cos}',380,840,{size:34,align:'center',alpha:pr(t,q[3]+1.5)});}
 }});
/* 18 動きで確かめる */
add({stage:4,name:'［5］公式を動きで確かめる',title:'公式の意味を {y:動き} で確かめる',
 telop:'意味がわかると覚えやすく、計算ミスにも気づける',
 draw(t,q){
  const th1=35*D,th2=(30+59.5*pr(t,q[0]+1.5,q[2]+1.5-(q[0]+1.5)))*D,B=[560,600],h=380,ceilY=B[1]-h;
  const den=Math.sin(th1+th2),t1=Math.cos(th2)/den,t2=Math.cos(th1)/den,k=230;
  const A1=[B[0]-h/Math.tan(th1),ceilY],A2=[B[0]+h/Math.tan(th2),ceilY];
  ceiling(80,1000,ceilY);seg(...A1,...B,C.line,{w:3,alpha:.55});seg(...A2,...B,C.line,{w:3,alpha:.55});
  angArc(...A1,70,0,th1,'{p:θ₁}',1);angArc(...A2,60,Math.PI,Math.PI-th2,'{p:θ₂ = '+Math.round(th2/D)+'°}',1,{lr:140});
  arrow(...B,B[0]-k*t1*Math.cos(th1),B[1]-k*t1*Math.sin(th1),C.T1);
  arrow(...B,B[0]+k*t2*Math.cos(th2),B[1]-k*t2*Math.sin(th2),C.T2);
  arrow(...B,B[0],B[1]+k*.85,C.mg);ball(...B,30,'m kg');
  card(1100,290,760,560,1);
  const bars=[['{b:T₁}',t1,C.T1],['{o:T₂}',t2,C.T2],['{r:mg}',1,C.mg]];
  bars.forEach(([lab,v,c],i)=>{const y=400+i*130;rich(lab,1140,y,{size:44});
    ctx.save();ctx.fillStyle=c;ctx.shadowColor=c;ctx.shadowBlur=12;rrect(1240,y-22,Math.max(20,v*420),44,Math.min(10,Math.max(20,v*420)/2));ctx.fill();ctx.restore();
    text(v.toFixed(2)+' mg',1240+Math.max(20,v*420)+16,y,{size:30,col:C.mute});});
  rich('{k:cos90°} = 0 → {b:T₁} = 0',1480,790,{size:40,align:'center',alpha:pr(t,q[2]+1)});
 }});
/* 19 テスト技 */
add({stage:4,name:'テスト技：公式で一気に',title:'テスト技：公式で ［4］ を {y:一気に} 解く',
 telop:'角度の和が90°なら sin90°=1 で分母が消える',
 draw(t,q){
  thumb(()=>{G4.arr=1;G4.comp=0;G4.angle=1;twoString(G4);},0,170,.6);
  card(640,220,1230,730,pr(t,q[0]));
  eqs([{m:'θ₁ = {p:30°}, θ₂ = {p:60°} → θ₁+θ₂ = {p:90°}',at:q[0]+1.5,size:42},{m:'sin{p:90°} = 1 → 分母が消える',at:q[1],size:42},{m:'{b:T₁} = {k:cos60°} × {r:4g} = [[{k:1}|2]] × {r:39.2} = {y:19.6 N}',at:q[2],size:42},{m:'{o:T₂} = {k:cos30°} × {r:4g} = [[{k:√3}|2]] × {r:39.2} ≈ {y:33.9 N}',at:q[3],size:42},{m:'［3］も：{b:T₁} = [[{k:cos30°}|sin60°]] × {r:6g} = {y:6g = 58.8 N}',at:q[4],size:42}],690,300,t);
  text('ふつうに解いた答えと同じ → 検算にも使える',1255,910,{size:30,col:C.hi,align:'center',alpha:pr(t,q[4]+2)});
 }});
/* 20 答え */
add({stage:5,name:'答え',title:'答え',
 telop:'g のまま答えても、9.8 を入れて N で答えてもOK',
 draw(t,q){
  const rows=[['［1］','{b:T₁} = 4g = 39.2 N','{o:T₂} = 2√3g ≈ 33.9 N'],['［2］','{b:T₁} = [[{r:mg}|{g:sinθ}]]','{o:T₂} = [[{r:mg}|tanθ]]'],['［3］','{b:T₁} = 6g = 58.8 N','{o:T₂} = 6g = 58.8 N'],['［4］','{b:T₁} = 2g = 19.6 N','{o:T₂} = 2√3g ≈ 33.9 N'],['［5］','{b:T₁} = [[{k:cosθ₂}|sin(θ₁+θ₂)]] × {r:mg}','{o:T₂} = [[{k:cosθ₁}|sin(θ₁+θ₂)]] × {r:mg}']];
  card(120,200,1680,740,pr(t,0));
  rows.forEach((r,i)=>{const a=pr(t,.4+i*.5,.5),y=275+i*140;
    text(r[0],180,y,{size:40,col:C.hi,alpha:a});rich(r[1],330,y,{size:40,alpha:a});rich(r[2],1080,y,{size:40,alpha:a});});
  text('（g = 9.8 m/s²）',1760,910,{size:26,col:C.mute,align:'right',alpha:pr(t,q[1])});
 }});
/* 21 要点 */
add({stage:5,name:'要点まとめ',title:'要点は {y:3つ}',
 telop:'この3ステップは、どんな「つり合い」の問題にも使える',
 draw(t,q){
  const pts=['① ななめの力は {g:たて T sinθ}・{k:よこ T cosθ} に分ける','② 水平・垂直で {y:つり合いの式} を文字のまま立てる','③ 数字を当てはめて解く。2本ななめは {y:公式で検算}'];
  pts.forEach((p,i)=>{const a=pr(t,q[i+1],.6),y=330+i*190;card(260,y-70,1400,140,a,'rgba(255,224,102,.06)');rich(p,320,y,{size:46,alpha:a});});
  text('ナレーション VOICEVOX:四国めたん ／ BGM ベートーヴェン「月光」第1楽章より',W/2,900,{size:24,col:C.mute,align:'center',alpha:pr(t,q[3]+2)});
 }});

/* ---------- タイムライン（ナレーションの文ごとの時刻に同期） ---------- */
S.forEach((s,i)=>{s.q=TIMING?TIMING.cues[i]:[.4,3,6,9,12,15];s.dur=TIMING?TIMING.durs[i]:16;});
let starts=[],TOTAL=0;S.forEach(s=>{starts.push(TOTAL);TOTAL+=s.dur;});
let T=0,playing=false,last=0,speed=1,fresh=true;
const au=document.getElementById('au');let audioOK=!!TIMING;au.addEventListener('error',()=>{audioOK=false;});
function sceneAt(tt){for(let k=0;k<S.length;k++){if(tt<starts[k]+S[k].dur)return k;}return S.length-1;}
function render(tt){
  const i=sceneAt(tt),sc=S[i],t=tt-starts[i];
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.drawImage(bgc,0,0);
  ctx.save();ctx.globalAlpha=clamp(t/.35);sc.draw(t,sc.q);chrome(sc,t);ctx.restore();
  return i;
}
const $=id=>document.getElementById(id);
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
function jump(x){fresh=false;T=Math.max(0,Math.min(TOTAL-.001,x));if(audioOK){try{au.currentTime=T;}catch(e){}}draw();}
const sc=$('scenes');
S.forEach((s,i)=>{const b=document.createElement('button');b.innerHTML=`<b>${fmt(starts[i])} · ${STAGES[s.stage-1]}</b>${s.name}`;b.onclick=()=>jump(starts[i]);sc.appendChild(b);});
let curScene=-1;
function draw(){
  const i=render(T);$('seek').value=Math.round(T/TOTAL*1000);$('time').textContent=`${fmt(T)} / ${fmt(TOTAL)}`;
  if(i!==curScene){curScene=i;[...sc.children].forEach((b,k)=>b.classList.toggle('on',k===i));}
}
function loop(now){if(!playing)return;const dt=Math.min(.1,(now-last)/1000);last=now;
  if(audioOK&&!au.paused&&au.readyState>=2&&au.currentTime<TOTAL)T=au.currentTime;else T+=dt*speed;
  if(T>=TOTAL){T=TOTAL-0.001;setPlay(false);}draw();requestAnimationFrame(loop);}
function setPlay(p){playing=p;$('play').textContent=p?'❚❚ 一時停止':'▶ 再生';$('bigplay').hidden=p;
  if(p){if(T>=TOTAL-.01||fresh)T=0;fresh=false;if(audioOK){try{au.currentTime=T;au.playbackRate=speed;}catch(e){}au.play().catch(()=>{audioOK=false;});}last=performance.now();requestAnimationFrame(loop);}
  else{au.pause();}}
$('play').onclick=()=>setPlay(!playing);$('bigplay').onclick=()=>setPlay(true);
$('prev').onclick=()=>{const i=sceneAt(T);jump(starts[Math.max(0,(T-starts[i]<1)?i-1:i)]);};
$('next').onclick=()=>{const i=sceneAt(T);jump(starts[Math.min(S.length-1,i+1)]);};
$('mute').onclick=()=>{au.muted=!au.muted;$('mute').textContent=au.muted?'🔇 音なし':'🔊 音あり';};
$('seek').oninput=e=>jump(e.target.value/1000*TOTAL);
$('speed').onchange=e=>{speed=+e.target.value;try{au.playbackRate=speed;}catch(err){}};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  if(e.code==='Space'){e.preventDefault();setPlay(!playing);}else if(e.code==='ArrowRight')$('next').click();else if(e.code==='ArrowLeft')$('prev').click();});
window.__renderAt=tt=>{render(tt);};window.__TOTAL=TOTAL;window.__starts=starts;
/* 静止状態でも内容が見えるよう、最初は問題提示シーンの完成形を表示 */
T=Math.min(S[0].dur-.2,8);
(document.fonts&&document.fonts.load?Promise.all([document.fonts.load(font(40,700)),document.fonts.load(font(40,900))]).catch(()=>{}):Promise.resolve()).then(()=>{draw();});
draw();
})();
</script>
